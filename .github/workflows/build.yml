name: Build Aimlock IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Create Native Xcode Project
        run: |
          rm -rf NativeApp
          mkdir -p NativeApp/Aimlock

          # Tạo Swift code mở rộng WebView full màn hình
          cat <<'EOF' > NativeApp/Aimlock/AppDelegate.swift
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  
                  let vc = UIViewController()
                  let config = WKWebViewConfiguration()
                  
                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 8/255, green: 11/255, blue: 20/255, alpha: 1)
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  
                  vc.view.addSubview(webView)
                  webView.translatesAutoresizingMaskIntoConstraints = false
                  NSLayoutConstraint.activate([
                      webView.topAnchor.constraint(equalTo: vc.view.topAnchor),
                      webView.bottomAnchor.constraint(equalTo: vc.view.bottomAnchor),
                      webView.leadingAnchor.constraint(equalTo: vc.view.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: vc.view.trailingAnchor)
                  ])

                  if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html") {
                      let url = URL(fileURLWithPath: htmlPath)
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
                  
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # Copy Web Assets
          cp index.html icon-192.png icon-512.png manifest.json NativeApp/Aimlock/ 2>/dev/null || true

          # Biên dịch Swift
          swiftc -parse-as-library \
                 -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 NativeApp/Aimlock/AppDelegate.swift \
                 -o NativeApp/Aimlock/Aimlock

          # Tạo Info.plist hỗ trợ Fullscreen & Status bar ẩn/trong suốt
          cat <<'EOF' > NativeApp/Aimlock/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Aimlock</string>
              <key>CFBundleIdentifier</key>
              <string>com.aimlock.app</string>
              <key>CFBundleName</key>
              <string>Aimlock</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
              <key>UIStatusBarHidden</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r NativeApp/Aimlock Payload/Aimlock.app
          zip -r Aimlock.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aimlock-IPA
          path: Aimlock.ipa
