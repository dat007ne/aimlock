name: Build Aimlock IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Chọn phiên bản Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Biên dịch Project Xcode
        run: |
          # Tiến hành build Xcode thành file .app
          # LƯU Ý: Thay "Aimlock.xcodeproj" và "Aimlock" bằng tên Project & Scheme thực tế của bạn
          xcodebuild -project "Aimlock.xcodeproj" \
                     -scheme "Aimlock" \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Đóng gói thành file IPA
        run: |
          mkdir -p Payload
          # Tìm file .app vừa build ra và copy vào Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Aimlock.ipa Payload

      - name: Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aimlock-IPA
          path: Aimlock.ipa
