name: Build Aimlock IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Install Capacitor
        run: |
          rm -rf ios package.json package-lock.json www capacitor.config.json
          mkdir -p www
          cp -r index.html icon-192.png icon-512.png manifest.json www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.aimlock.app",
            "appName": "Aimlock",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add ios
          npx cap sync ios

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Aimlock.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aimlock-IPA
          path: Aimlock.ipa
