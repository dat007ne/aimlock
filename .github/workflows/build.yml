name: Build Aimlock IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Inject CSS Fix & Create Native Project
        run: |
          rm -rf NativeApp
          mkdir -p NativeApp/Aimlock

          # 1. Thêm CSS ẩn banner PWA
          if [ -f index.html ]; then
            sed -i '' 's|</head>|<style>button:contains("PWA"), [class*="pwa"], [id*="pwa"] { display: none !important; }</style></head>|g' index.html 2>/dev/null || true
          fi

          # 2. Tạo file AppDelegate.swift
          cat <<'EOF' > NativeApp/Aimlock/AppDelegate.swift
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  let config = WKWebViewConfiguration()
                  let webView = WKWebView(frame: vc.view.bounds, configuration: config)
                  
                  if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html") {
                      let url = URL(fileURLWithPath: htmlPath)
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
                  
                  vc.view.addSubview(webView)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # 3. Copy tài nguyên vào dự án
          cp index.html icon-192.png icon-512.png manifest.json NativeApp/Aimlock/ 2>/dev/null || true

          # 4. Biên dịch file Swift
          swiftc -parse-as-library \
                 -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 NativeApp/Aimlock/AppDelegate.swift \
                 -o NativeApp/Aimlock/Aimlock

          # 5. Tạo Info.plist
          cat <<'EOF' > NativeApp/Aimlock/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Aimlock</string>
              <key>CFBundleIdentifier</key>
              <string>com.aimlock.app</string>
              <key>CFBundleName</key>
              <string>Aimlock</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r NativeApp/Aimlock Payload/Aimlock.app
          zip -r Aimlock.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aimlock-IPA
          path: Aimlock.ipa
