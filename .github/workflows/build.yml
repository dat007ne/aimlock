name: Build Aimlock IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project Aimlock.xcodeproj \
            -scheme Aimlock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R \
            ios/build/Build/Products/Release-iphoneos/Aimlock.app \
            Payload/Aimlock.app

          zip -r Aimlock-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aimlock-IPA
          path: Aimlock-unsigned.ipa
          if-no-files-found: error
