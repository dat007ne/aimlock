name: Build Aimlock IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Create Native iOS Wrapper
        run: |
          rm -rf ios AimlockApp
          mkdir -p AimlockApp/Payload/Aimlock.app
          
          # Copy các file web vào thư mục app
          cp -r index.html icon-192.png icon-512.png manifest.json AimlockApp/Payload/Aimlock.app/ 2>/dev/null || true
          
          # Tạo file Info.plist cơ bản cho iOS
          cat <<'EOF' > AimlockApp/Payload/Aimlock.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Aimlock</string>
              <key>CFBundleIdentifier</key>
              <string>com.aimlock.app</string>
              <key>CFBundleName</key>
              <string>Aimlock</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          cd AimlockApp
          zip -r ../Aimlock.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aimlock-IPA
          path: Aimlock.ipa
